# Example client-hosted values.
# This file should be copied per client and stored outside source control if it contains sensitive names.

client:
  id: acme-fintech
  name: "Acme Fintech"
  industry: fintech
  environment: EKS-NONPROD

domain:
  baseDomain: devsecops.acme-demo.com
  frontendHost: devsecops.acme-demo.com
  backendPath: /pipeline/api
  jenkinsHost: jenkins.devsecops.acme-demo.com
  keycloakHost: keycloak.devsecops.acme-demo.com

aws:
  region: us-east-1
  accountId: "111122223333"
  ecrRegistry: "111122223333"
  artifactBucket: acme-fintech-devsecops-artifacts
  executionRoleArn: arn:aws:iam::111122223333:role/AcmeDevSecOpsExecutionRole
  snsTopicArn: arn:aws:sns:us-east-1:111122223333:acme-devsecops-notifications

license:
  enforcementEnabled: true
  type: trial
  key: replace-with-issued-license-key
  expiresAt: "2026-05-28T23:59:59Z"
  enabledPipelines:
    - Devops Pipeline
    - Test Devops Pipeline
  enabledFeatures:
    - build
    - artifact_publish
    - code_scan
    - image_scan
    - policy_validation
    - static_application_security
    - test_suites
    - notifications
  allowedEnvironments:
    - EKS-NONPROD
  limits:
    maxRepos: 3
    maxBuildsPerMonth: 25
    maxUsers: 10

secrets:
  useExternalSecrets: true
  licenseSigningSecretName: horizon-license-signing
  githubCredentialSecretName: client-github-token
  ldapAdminSecretName: client-openldap-admin
  jenkinsAdminSecretName: client-jenkins-admin
