# Example client-hosted values.
# Copy this file to client-values.local.yaml and replace placeholders.
# Do not commit real client values, secrets, activation tokens, or Terraform backend details.

installer:
  mode: byo-infra # full-provision | byo-infra
  releaseName: horizon-ai-devsecops
  namespace: horizon-platform

client:
  id: acme-fintech
  name: "Acme Fintech"
  industry: fintech
  dataBoundary: client-hosted

domain:
  baseDomain: devsecops.acme-demo.com
  frontendHost: devsecops.acme-demo.com
  backendPath: /pipeline/api
  jenkinsHost: jenkins.devsecops.acme-demo.com
  keycloakHost: keycloak.devsecops.acme-demo.com

aws:
  region: us-east-1
  artifactBucket: acme-fintech-devsecops-artifacts
  accounts:
    dev:
      accountId: "111122223333"
      roleArn: arn:aws:iam::111122223333:role/HorizonDevDeployRole
      clusterName: acme-dev-eks
      namespace: acme-app-dev
    qa:
      accountId: "111122223333"
      roleArn: arn:aws:iam::111122223333:role/HorizonQaDeployRole
      clusterName: acme-qa-eks
      namespace: acme-app-qa
    stage:
      accountId: "111122223333"
      roleArn: arn:aws:iam::111122223333:role/HorizonStageDeployRole
      clusterName: acme-stage-eks
      namespace: acme-app-stage
    prod:
      accountId: "444455556666"
      sourceRoleArn: arn:aws:iam::111122223333:role/HorizonProdPromotionSourceRole
      targetRoleArn: arn:aws:iam::444455556666:role/HorizonProdPromotionTargetRole
      clusterName: acme-prod-eks
      namespace: acme-app-prod
  ecr:
    mirrorHorizonImages: true
    horizonRegistryAccountId: "426946630837"
    horizonRegistryRegion: us-east-1
    horizonRegistry: 426946630837.dkr.ecr.us-east-1.amazonaws.com
    productRepositoryPrefix: horizon
    applicationRepositoryPrefix: acme-devsecops
  notifications:
    snsTopicArn: arn:aws:sns:us-east-1:111122223333:acme-devsecops-notifications

license:
  enforcementEnabled: true
  mode: online-sync # online-sync | offline-file
  syncEndpoint: https://license.horizonrelevance.com/api/v1/licenses/sync
  clientId: acme-fintech
  activationTokenSecretName: horizon-license-activation
  renewalCheckHours: 24
  type: trial
  expiresAt: "2026-05-28T23:59:59Z"
  enabledPipelines:
    - Devops Pipeline
    - Test Devops Pipeline
  enabledFeatures:
    - build
    - artifact_publish
    - code_scan
    - image_scan
    - policy_validation
    - static_application_security
    - test_suites
    - notifications
  allowedEnvironments:
    - DEV
    - QA
  allowedAwsAccountIds:
    - "111122223333"
  installationId: acme-fintech-horizon-trial-001
  limits:
    maxRepos: 3
    maxBuildsPerMonth: 25
    maxUsers: 10

identity:
  mode: client-oidc # client-oidc | client-saml | existing-ldap | managed-keycloak-openldap
  keycloak:
    deploy: true
  ldap:
    enabled: false
    host: ldap.client.example
    baseDn: dc=client,dc=example
    bindSecretName: client-ldap-bind

components:
  frontend:
    enabled: true
    image: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/frontend:1.4.18
  backend:
    enabled: true
    image: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/backend:1.4.21
  jenkins:
    enabled: true
    image: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/jenkins:1.0.7
    sharedLibrary:
      source: private-git # private-git | release-bundle | baked-in-image
      repository: git@github.com:ankur1825/jenkins-shared-library.git
      branch: main
  sonarqube:
    enabled: true
    image: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/sonarqube:10.4-community
  trivy:
    enabled: true
    image: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/trivy-scanner:1.1.2
  opa:
    enabled: true
    image: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/opa-scanner:1.0.1
  openldap:
    enabled: false
  keycloak:
    enabled: true

existingInfrastructure:
  ingressClassName: nginx
  storageClassName: gp3
  useExistingVpc: true
  useExistingEks: true
  useExistingEcr: true
  useExistingArtifactBucket: true
