accessModel:
  iamMode: validation-only # validation-only | provision | disabled
  eksAccessMode: namespace-scoped
  jenkins:
    serviceAccount:
      state: existing # existing | provision
      deletionPolicy: retain
      name: jenkins
      namespace: horizon-relevance-dev
    runtimeRole:
      state: existing # existing | provision
      deletionPolicy: retain
      roleArn: arn:aws:iam::426946630837:role/HorizonJenkinsRuntimeRole
  backend:
    validationRole:
      state: existing # existing | provision | disabled
      deletionPolicy: retain
      roleArn: arn:aws:iam::426946630837:role/HorizonBackendValidationRole
  validation:
    backendPreflightEnforced: true
    installerValidatesRoles: true
    failOnClusterScopedDeployRole: true

