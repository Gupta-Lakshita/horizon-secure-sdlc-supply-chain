# Generic client-hosted onboarding values.
#
# This file is the desired-state contract for enterprise onboarding. Copy it to a
# client-local file and update the values for the client account. Do not commit
# client-local files containing private endpoints, account details, tokens, or secrets.
#
# Resource lifecycle values:
# - existing: client already owns the resource; preflight/validate verifies it.
# - provision: installer may create/configure the resource through Terraform/Helm.
# - disabled: resource is intentionally not used for this environment.
#
# Deletion policy values:
# - retain: destroy skips the resource even if it is referenced.
# - delete: destroy may remove it only if Terraform state proves the installer created it.

installer:
  mode: hybrid # full-provision | partial-provision | byo-infra | validate-only | hybrid
  releaseName: horizon-internal-devsecops-platform
  namespace: horizon-relevance-dev
  dryRunDefault: true
  targetEnvironments:
    - DEV
    - QA
    - STAGE
    - PROD

terraformState:
  state: provision # existing | provision
  backend: s3
  bucket: acme-fintech-devsecops-tfstate
  region: us-east-1
  lockTable: acme-fintech-devsecops-tflock
  kmsKeyArn: ""
  keyPrefix: horizon-installer
  createBackendResources: false
  deletionPolicy: retain

lifecycle:
  deletionProtection: true
  requireTypedConfirmation: true
  allowDestroyExistingResources: false
  defaultDeletionPolicy: retain

client:
  id: acme-fintech
  name: "Acme Fintech"
  industry: fintech
  dataBoundary: client-hosted

license:
  enforcementEnabled: true
  mode: online-sync
  syncEndpoint: https://license.horizonrelevance.com/api/v1/licenses/sync
  clientId: acme-fintech
  activationTokenSecretName: horizon-license-activation
  renewalCheckHours: 24
  type: trial
  expiresAt: "2026-06-16T23:59:59Z"
  enabledPipelines:
    - Build & Deploy Pipeline
    - Test DevSecOps Pipeline
    - Production Release Pipeline
  enabledFeatures:
    - build
    - artifact_publish
    - code_scan
    - image_scan
    - policy_validation
    - static_application_security
    - test_suites
    - notifications
    - production_promotion
  allowedEnvironments:
    - DEV
    - QA
    - STAGE
    - PROD
  allowedAwsAccountIds:
    - "426946630837"
  installationId: acme-fintech-horizon-trial-001
  limits:
    maxRepos: 10
    maxBuildsPerMonth: 100
    maxUsers: 25

domain:
  state: existing # existing | provision | disabled
  deletionPolicy: retain
  provider: route53 # route53 | external-dns | manual
  baseDomain: horizonrelevance.com
  platformHosts:
    frontendHost: horizonrelevance.com
    backendPath: /pipeline/api
    jenkinsHost: horizonrelevance.com
    jenkinsPath: /jenkins
    sonarqubeHost: sonar.horizonrelevance.com
  certificate:
    state: existing # existing | provision | disabled
    deletionPolicy: retain
    acmCertificateArn: ""

catalogSync:
  # Internal demo endpoint currently uses a certificate chain that local curl
  # cannot validate. Enterprise installs should keep tlsVerify=true or provide
  # caBundlePath for the client/private CA.
  tlsVerify: false
  caBundlePath: ""

identity:
  mode: existing-ldap # client-oidc | client-saml | existing-ldap | managed-keycloak-openldap
  keycloak:
    state: existing # existing | provision | disabled
    deletionPolicy: retain
    deploy: true
  ldap:
    state: existing # existing | provision | disabled
    deletionPolicy: retain
    enabled: true
    host: ldap://openldap.horizon-relevance-dev.svc.cluster.local:389     #ldaps://ldap.client.example:636
    baseDn: dc=horizonrelevance,dc=local
    userBaseDn: ou=Users,dc=horizonrelevance,dc=local
    bindSecretName: horizon-ldap-bind
    groupBaseDn: ou=Groups,dc=horizonrelevance,dc=local
    groupSearchFilter: "(&(objectClass=group)(member={user_dn}))"
    groupMemberAttribute: member
    groupNameAttribute: cn
    userGroupAttribute: memberOf
    roleGroupMappings:
      platform-admin:
        - CN=horizon-Platform-Admins,OU=Groups,DC=horizonrelevance,DC=local
      developer:
        - CN=horizon-Developers,OU=Groups,DC=horizonrelevance,DC=local
      qa:
        - CN=horizon-QA,OU=Groups,DC=horizonrelevance,DC=local
      release-manager:
        - CN=horizon-Release-Managers,OU=Groups,DC=horizonrelevance,DC=local
      viewer:
        - CN=horizon-Viewers,OU=Groups,DC=cliehorizonrelevance,DC=local

platform:
  accountId: "426946630837"
  region: us-east-1
  terraform:
    stateKey: horizon-installer/platform/terraform.tfstate
  cluster:
    state: existing # existing | provision | disabled
    deletionPolicy: retain
    name: horizon-eks-dev
    namespace: horizon-relevance-dev
    ingressClassName: nginx
    storageClassName: gp3
