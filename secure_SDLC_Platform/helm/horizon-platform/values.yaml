installer:
  mode: byo-infra
  releaseName: horizon-ai-devsecops
  namespace: horizon-platform

client:
  id: example-client
  name: "Example Client"
  industry: unknown
  dataBoundary: client-hosted

# The platform runs from client DNS. Application ingress hosts can be resolved from the
# Environment Catalog or supplied by the application deployment workflow.
domain:
  baseDomain: example.com
  frontendHost: horizon.example.com
  backendPath: /pipeline/api
  jenkinsHost: jenkins.example.com
  keycloakHost: keycloak.example.com
  sonarqubeHost: sonar.example.com

# Bootstrap AWS details are retained for Terraform/preflight compatibility.
# Runtime pipeline forms should not ask developers for these values; developers select
# a target environment and the backend resolves details from environmentCatalog.
aws:
  region: us-east-1
  artifactBucket: example-devsecops-artifacts
  accounts:
    dev:
      accountId: "111122223333"
      roleArn: arn:aws:iam::111122223333:role/HorizonDevDeployRole
      clusterName: example-dev-eks
      namespace: example-app-dev
    qa:
      accountId: "111122223333"
      roleArn: arn:aws:iam::111122223333:role/HorizonQaDeployRole
      clusterName: example-qa-eks
      namespace: example-app-qa
    stage:
      accountId: "111122223333"
      roleArn: arn:aws:iam::111122223333:role/HorizonStageDeployRole
      clusterName: example-stage-eks
      namespace: example-app-stage
    prod:
      accountId: "444455556666"
      sourceRoleArn: arn:aws:iam::111122223333:role/HorizonProdPromotionSourceRole
      targetRoleArn: arn:aws:iam::444455556666:role/HorizonProdPromotionTargetRole
      clusterName: example-prod-eks
      namespace: example-app-prod
  ecr:
    mirrorHorizonImages: true
    horizonRegistryAccountId: "426946630837"
    horizonRegistryRegion: us-east-1
    horizonRegistry: 426946630837.dkr.ecr.us-east-1.amazonaws.com
    horizonSourceRegistry: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon
    productRepositoryPrefix: horizon
    applicationRepositoryPrefix: example-devsecops
  notifications:
    snsTopicArn: arn:aws:sns:us-east-1:111122223333:example-devsecops-notifications

accessModel:
  iamMode: validation-only
  eksAccessMode: namespace-scoped
  jenkins:
    createServiceAccount: true
    serviceAccountName: jenkins
    serviceAccountNamespace: horizon-platform
    irsaRoleArn: arn:aws:iam::111122223333:role/HorizonJenkinsRuntimeRole
  validation:
    backendPreflightEnforced: true
    installerValidatesRoles: true

# Admin-owned catalog. The installer seeds this into the platform namespace.
# The backend serves it to the UI and resolves AWS/EKS/S3/ECR values before triggering Jenkins.
# Developers should only select Target Environment; they should not type AWS account IDs, role ARNs,
# cluster names, or artifact buckets in day-to-day pipeline requests.
environmentCatalog:
  environments:
    - name: DEV
      displayName: Development
      accountTier: nonprod
      awsAccountId: "111122223333"
      awsRegion: us-east-1
      ecrRegistry: 111122223333.dkr.ecr.us-east-1.amazonaws.com
      ecrRepositoryTemplate: example-devsecops/${projectName}
      artifactBucket: example-devsecops-artifacts
      clientAwsRoleArn: arn:aws:iam::111122223333:role/HorizonDevDeployRole
      nonprodAwsRoleArn: arn:aws:iam::111122223333:role/HorizonDevDeployRole
      clusterName: example-dev-eks
      namespaceStrategy: per-app
      namespaceTemplate: ${clientId}-${projectName}-dev
      iamValidationMode: validation-only
      eksAccessMode: namespace-scoped
      snsTopicArn: arn:aws:sns:us-east-1:111122223333:example-devsecops-notifications
      isActive: true
    - name: QA
      displayName: Quality Assurance
      accountTier: nonprod
      awsAccountId: "111122223333"
      awsRegion: us-east-1
      ecrRegistry: 111122223333.dkr.ecr.us-east-1.amazonaws.com
      ecrRepositoryTemplate: example-devsecops/${projectName}
      artifactBucket: example-devsecops-artifacts
      clientAwsRoleArn: arn:aws:iam::111122223333:role/HorizonQaDeployRole
      nonprodAwsRoleArn: arn:aws:iam::111122223333:role/HorizonQaDeployRole
      clusterName: example-qa-eks
      namespaceStrategy: per-app
      namespaceTemplate: ${clientId}-${projectName}-qa
      iamValidationMode: validation-only
      eksAccessMode: namespace-scoped
      snsTopicArn: arn:aws:sns:us-east-1:111122223333:example-devsecops-notifications
      isActive: true
    - name: STAGE
      displayName: Stage
      accountTier: nonprod
      awsAccountId: "111122223333"
      awsRegion: us-east-1
      ecrRegistry: 111122223333.dkr.ecr.us-east-1.amazonaws.com
      ecrRepositoryTemplate: example-devsecops/${projectName}
      artifactBucket: example-devsecops-artifacts
      clientAwsRoleArn: arn:aws:iam::111122223333:role/HorizonStageDeployRole
      nonprodAwsRoleArn: arn:aws:iam::111122223333:role/HorizonStageDeployRole
      clusterName: example-stage-eks
      namespaceStrategy: per-app
      namespaceTemplate: ${clientId}-${projectName}-stage
      iamValidationMode: validation-only
      eksAccessMode: namespace-scoped
      snsTopicArn: arn:aws:sns:us-east-1:111122223333:example-devsecops-notifications
      isActive: true
    - name: PROD
      displayName: Production
      accountTier: prod
      awsAccountId: "444455556666"
      awsRegion: us-east-1
      ecrRegistry: 444455556666.dkr.ecr.us-east-1.amazonaws.com
      ecrRepositoryTemplate: example-devsecops/${projectName}
      artifactBucket: example-prod-devsecops-artifacts
      sourceAwsRoleArn: arn:aws:iam::111122223333:role/HorizonProdPromotionSourceRole
      targetAwsRoleArn: arn:aws:iam::444455556666:role/HorizonProdPromotionTargetRole
      clusterName: example-prod-eks
      namespaceStrategy: per-app
      namespaceTemplate: ${clientId}-${projectName}-prod
      iamValidationMode: validation-only
      eksAccessMode: namespace-scoped
      snsTopicArn: arn:aws:sns:us-east-1:444455556666:example-app-prod-notifications
      requiresApproval: true
      isActive: true

license:
  enforcementEnabled: true
  mode: online-sync # online-sync | offline-file
  syncEndpoint: https://license.horizonrelevance.com/api/v1/licenses/sync
  # Stable key assigned by Horizon during onboarding. This is identity, not an
  # entitlement. Trial/paid/enterprise terms are returned by signed license sync.
  clientId: example-client
  # Store the actual activation token in this Kubernetes Secret or in the
  # client's external secret manager. Never commit the raw token to values.
  activationTokenSecretName: horizon-license-activation
  renewalCheckHours: 24
  # Do not configure license type, expiry, allowed accounts/environments,
  # enabled pipelines/features, installation binding, or usage limits here.
  # Those values are controlled by Horizon's license service and returned as
  # signed entitlements during online sync.

identity:
  mode: client-oidc
  # Optional bootstrap users/emails for first install. These users must still
  # authenticate successfully through LDAP/IdP, but receive platform-admin until
  # enterprise group mappings are fully wired. Keep empty after onboarding.
  bootstrapPlatformAdmins: []
  # Optional role grants keyed by Horizon role, for example:
  # bootstrapRoleGrants:
  #   developer: ["dev.user@client.com"]
  bootstrapRoleGrants: {}
  keycloak:
    deploy: true
  ldap:
    enabled: false
    host: ""
    baseDn: ""
    userBaseDn: ""
    bindSecretName: ""
    groupBaseDn: ""
    groupSearchFilter: "(&(objectClass=group)(member={user_dn}))"
    groupMemberAttribute: member
    groupNameAttribute: cn
    userGroupAttribute: memberOf
    # Client-specific AD/LDAP groups are mapped to generic Horizon roles.
    # Values may be group CNs or full group DNs. The product UI and API expose roles, not raw group names.
    roleGroupMappings:
      platform-admin: []
      developer: []
      qa: []
      release-manager: []
      viewer: []

components:
  frontend:
    enabled: true
    image: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/frontend:1.4.27
  backend:
    enabled: true
    image: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/backend:1.4.34
  jenkins:
    enabled: true
    image: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/jenkins:1.0.8
    sharedLibrary:
      source: private-git # private-git | release-bundle | baked-in-image
      repository: git@github.com:ankur1825/jenkins-shared-library.git
      branch: main
  sonarqube:
    enabled: true
    image: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/sonarqube:10.4-community
  trivy:
    enabled: true
    image: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/trivy-scanner:1.1.2
  opa:
    enabled: true
    image: 426946630837.dkr.ecr.us-east-1.amazonaws.com/horizon/opa-scanner:1.0.1
  openldap:
    enabled: false
  keycloak:
    enabled: true

existingInfrastructure:
  ingressClassName: nginx
  storageClassName: gp3
  useExistingVpc: true
  useExistingEks: true
  useExistingEcr: true
  useExistingArtifactBucket: true
