{{- $components := default dict .Values.components -}}
{{- $jenkins := default dict $components.jenkins -}}
{{- if default true $jenkins.enabled }}
{{- $secretName := default "horizon-jenkins-credentials" $jenkins.credentialsSecretName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingAdminUser := "" -}}
{{- $existingAdminPassword := "" -}}
{{- $existingServiceUser := "" -}}
{{- $existingServicePassword := "" -}}
{{- $existingServiceToken := "" -}}
{{- if and $existing (hasKey $existing.data "JENKINS_ADMIN_USER") -}}
{{- $existingAdminUser = (index $existing.data "JENKINS_ADMIN_USER" | b64dec) -}}
{{- end -}}
{{- if and $existing (hasKey $existing.data "JENKINS_ADMIN_PASSWORD") -}}
{{- $existingAdminPassword = (index $existing.data "JENKINS_ADMIN_PASSWORD" | b64dec) -}}
{{- end -}}
{{- if and $existing (hasKey $existing.data "JENKINS_SERVICE_USER") -}}
{{- $existingServiceUser = (index $existing.data "JENKINS_SERVICE_USER" | b64dec) -}}
{{- end -}}
{{- if and $existing (hasKey $existing.data "JENKINS_SERVICE_PASSWORD") -}}
{{- $existingServicePassword = (index $existing.data "JENKINS_SERVICE_PASSWORD" | b64dec) -}}
{{- end -}}
{{- if and $existing (hasKey $existing.data "JENKINS_SERVICE_TOKEN") -}}
{{- $existingServiceToken = (index $existing.data "JENKINS_SERVICE_TOKEN" | b64dec) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-jenkins
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  JENKINS_ADMIN_USER: {{ default (default "horizon-admin" $jenkins.adminUser) $existingAdminUser | quote }}
  JENKINS_ADMIN_PASSWORD: {{ default (default (randAlphaNum 32) $jenkins.adminPassword) $existingAdminPassword | quote }}
  JENKINS_SERVICE_USER: {{ default (default "horizon-backend" $jenkins.serviceUser) $existingServiceUser | quote }}
  JENKINS_SERVICE_PASSWORD: {{ default (default (randAlphaNum 32) $jenkins.servicePassword) $existingServicePassword | quote }}
  JENKINS_SERVICE_TOKEN: {{ default (default (randAlphaNum 48) $jenkins.apiToken) $existingServiceToken | quote }}
{{- end }}
