apiVersion: v1
kind: Secret
metadata:
  name: horizon-enterprise-license-defaults
  namespace: {{ .Values.installer.namespace | quote }}
  labels:
    app.kubernetes.io/name: horizon-platform
    app.kubernetes.io/component: license
type: Opaque
stringData:
  ENTERPRISE_LICENSE_ENFORCEMENT_ENABLED: {{ .Values.license.enforcementEnabled | quote }}
  ENTERPRISE_CLIENT_ID: {{ .Values.client.id | quote }}
  ENTERPRISE_CLIENT_NAME: {{ .Values.client.name | quote }}
  ENTERPRISE_LICENSE_TYPE: {{ .Values.license.type | quote }}
  ENTERPRISE_LICENSE_EXPIRES_AT: {{ .Values.license.expiresAt | quote }}
  ENTERPRISE_ENABLED_PIPELINES: {{ join "," .Values.license.enabledPipelines | quote }}
  ENTERPRISE_ENABLED_FEATURES: {{ join "," .Values.license.enabledFeatures | quote }}
  ENTERPRISE_ALLOWED_ENVIRONMENTS: {{ join "," .Values.license.allowedEnvironments | quote }}
  ENTERPRISE_ALLOWED_AWS_ACCOUNT_IDS: {{ join "," .Values.license.allowedAwsAccountIds | quote }}
  ENTERPRISE_INSTALLATION_ID: {{ .Values.license.installationId | quote }}
  ENTERPRISE_MAX_REPOS: {{ .Values.license.limits.maxRepos | quote }}
  ENTERPRISE_MAX_BUILDS_PER_MONTH: {{ .Values.license.limits.maxBuildsPerMonth | quote }}
  ENTERPRISE_MAX_USERS: {{ .Values.license.limits.maxUsers | quote }}
  ENTERPRISE_LICENSE_MODE: {{ .Values.license.mode | quote }}
  ENTERPRISE_LICENSE_SYNC_ENDPOINT: {{ .Values.license.syncEndpoint | quote }}
  ENTERPRISE_LICENSE_ACTIVATION_SECRET_NAME: {{ .Values.license.activationTokenSecretName | quote }}
