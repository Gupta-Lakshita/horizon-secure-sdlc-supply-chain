{{- $jenkins := default dict .Values.accessModel.jenkins -}}
{{- $sa := default dict $jenkins.serviceAccount -}}
{{- $runtimeRole := default dict $jenkins.runtimeRole -}}
{{- $legacyCreate := default false $jenkins.createServiceAccount -}}
{{- $state := default "" $sa.state -}}
{{- if or $legacyCreate (eq $state "provision") -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (default "jenkins" $jenkins.serviceAccountName) $sa.name }}
  namespace: {{ default .Release.Namespace (default $jenkins.serviceAccountNamespace $sa.namespace) }}
  labels:
    app.kubernetes.io/name: horizon-jenkins
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- $roleArn := default (default "" $jenkins.irsaRoleArn) $runtimeRole.roleArn -}}
  {{- if $roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $roleArn | quote }}
  {{- end }}
{{- end }}
