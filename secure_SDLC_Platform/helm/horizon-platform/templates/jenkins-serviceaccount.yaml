{{- if .Values.accessModel.jenkins.createServiceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.accessModel.jenkins.serviceAccountName | default "jenkins" | quote }}
  namespace: {{ .Values.accessModel.jenkins.serviceAccountNamespace | default .Values.installer.namespace | quote }}
  labels:
    app.kubernetes.io/name: horizon-platform
    app.kubernetes.io/component: jenkins-runtime
  annotations:
    eks.amazonaws.com/role-arn: {{ required "accessModel.jenkins.irsaRoleArn is required when creating the Jenkins IRSA service account" .Values.accessModel.jenkins.irsaRoleArn | quote }}
{{- end }}
