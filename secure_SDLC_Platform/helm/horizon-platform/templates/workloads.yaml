{{- $values := .Values -}}
{{- $components := default dict $values.components -}}
{{- $frontend := default dict $components.frontend -}}
{{- $backend := default dict $components.backend -}}
{{- $jenkins := default dict $components.jenkins -}}
{{- $jenkinsRunner := default dict $jenkins.runner -}}
{{- $runner := default dict $components.runner -}}
{{- $runnerSonar := default dict $runner.sonar -}}
{{- $sonarqube := default dict $components.sonarqube -}}
{{- $sonarqubeAuth := default dict $sonarqube.auth -}}
{{- $sonarqubeAuthProvider := lower (default "local" $sonarqubeAuth.provider) -}}
{{- $sonarqubeLdap := default dict $sonarqubeAuth.ldap -}}
{{- $sonarqubeSaml := default dict $sonarqubeAuth.saml -}}
{{- $sonarqubeSamlProperties := default dict $sonarqubeSaml.properties -}}
{{- $sonarqubeExtraProperties := default dict $sonarqube.extraProperties -}}
{{- $sonarqubeConfigSecretName := default "" $sonarqube.configurationSecretName -}}
{{- $sonarqubeConfigSecretKey := default "sonar.properties" $sonarqube.configurationSecretKey -}}
{{- $sonarqubeGeneratedConfigEnabled := and (not $sonarqubeConfigSecretName) (or (ne $sonarqubeAuthProvider "local") (gt (len $sonarqubeExtraProperties) 0)) -}}
{{- $sonarqubeConfigEnabled := or $sonarqubeConfigSecretName $sonarqubeGeneratedConfigEnabled -}}
{{- $platform := default dict $values.platform -}}
{{- $cluster := default dict $platform.cluster -}}
{{- $accessModel := default dict $values.accessModel -}}
{{- $backendAccess := default dict $accessModel.backend -}}
{{- $backendSa := default dict $backendAccess.serviceAccount -}}
{{- $jenkinsAccess := default dict $accessModel.jenkins -}}
{{- $jenkinsSa := default dict $jenkinsAccess.serviceAccount -}}
{{- $domain := default dict $values.domain -}}
{{- $platformHosts := default dict $domain.platformHosts -}}
{{- $catalogSync := default dict $values.catalogSync -}}
{{- $license := default dict $values.license -}}
{{- $identity := default dict $values.identity -}}
{{- $ldap := default dict $identity.ldap -}}
{{- $backendSecretName := default "horizon-backend-secrets" $platform.backendSecretName -}}
{{- $jenkinsCredentialsSecretName := default "horizon-jenkins-credentials" $jenkins.credentialsSecretName -}}
{{- $jenkinsLdap := default dict $jenkins.ldap -}}
{{- $jenkinsPath := default "/" $platformHosts.jenkinsPath -}}
{{- $imagePullSecrets := default (default list $values.imagePullSecrets) $platform.imagePullSecrets -}}
{{- if default true $frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ default 1 $frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: horizon-frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: horizon-frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- range $imagePullSecrets }}
        - name: {{ if kindIs "map" . }}{{ .name | quote }}{{ else }}{{ . | quote }}{{ end }}
        {{- end }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ required "components.frontend.image is required" $frontend.image | quote }}
          imagePullPolicy: {{ default "Always" $frontend.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: horizon-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: horizon-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
{{- end }}
{{- if default true $backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ default 1 $backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: horizon-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: horizon-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/jenkins-credentials: {{ include (print $.Template.BasePath "/jenkins-credentials-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ default "horizon-backend" $backendSa.name }}
      securityContext:
        fsGroup: 10001
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- range $imagePullSecrets }}
        - name: {{ if kindIs "map" . }}{{ .name | quote }}{{ else }}{{ . | quote }}{{ end }}
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: {{ required "components.backend.image is required" $backend.image | quote }}
          imagePullPolicy: {{ default "Always" $backend.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_PATH
              value: /app/data
            - name: JENKINS_URL
              value: {{ default "http://horizon-jenkins:8080" $backend.jenkinsUrl | quote }}
            - name: JENKINS_EXECUTION_MODE
              value: {{ default "runner" $jenkins.executionMode | quote }}
            - name: HORIZON_RUNNER_URL
              value: {{ default "http://horizon-runner:8080" $jenkinsRunner.url | quote }}
            - name: JENKINS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $jenkinsCredentialsSecretName | quote }}
                  key: JENKINS_SERVICE_USER
            - name: JENKINS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $jenkinsCredentialsSecretName | quote }}
                  key: JENKINS_SERVICE_TOKEN
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $backendSecretName | quote }}
                  key: GITHUB_WEBHOOK_SECRET
            - name: JENKINS_RUNTIME_ROLE_ARN
              valueFrom:
                configMapKeyRef:
                  name: horizon-enterprise-config
                  key: JENKINS_RUNTIME_ROLE_ARN
                  optional: true
            - name: ENVIRONMENT_PREFLIGHT_ENFORCED
              valueFrom:
                configMapKeyRef:
                  name: horizon-enterprise-config
                  key: BACKEND_PREFLIGHT_ENFORCED
                  optional: true
            - name: ENVIRONMENT_IAM_MODE
              valueFrom:
                configMapKeyRef:
                  name: horizon-enterprise-config
                  key: IAM_MODE
                  optional: true
            - name: ENVIRONMENT_EKS_ACCESS_MODE
              valueFrom:
                configMapKeyRef:
                  name: horizon-enterprise-config
                  key: EKS_ACCESS_MODE
                  optional: true
            - name: ENVIRONMENT_CATALOG_FILE
              value: /app/config/environment-catalog.json
            {{- if $catalogSync.tokenSecretName }}
            - name: ENVIRONMENT_CATALOG_SYNC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $catalogSync.tokenSecretName | quote }}
                  key: {{ default "token" $catalogSync.tokenSecretKey | quote }}
            {{- end }}
            - name: LDAP_SERVER
              value: {{ default "ldap://horizon-openldap:389" $ldap.host | quote }}
            - name: LDAP_USER
              value: {{ default "cn=admin,dc=horizonrelevance,dc=local" $ldap.bindDn | quote }}
            - name: LDAP_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "horizon-ldap-bind" $ldap.bindSecretName | quote }}
                  key: {{ default "password" $ldap.bindSecretKey | quote }}
                  optional: true
            - name: LDAP_BASE_DN
              value: {{ default "ou=users,dc=horizonrelevance,dc=local" $ldap.userBaseDn | quote }}
            - name: LDAP_GROUP_BASE_DN
              value: {{ default "ou=groups,dc=horizonrelevance,dc=local" $ldap.groupBaseDn | quote }}
            - name: LDAP_GROUP_SEARCH_FILTER
              value: {{ default "(&(objectClass=groupOfNames)(member={user_dn}))" $ldap.groupSearchFilter | quote }}
            - name: LDAP_GROUP_MEMBER_ATTRIBUTE
              value: {{ default "member" $ldap.groupMemberAttribute | quote }}
            - name: LDAP_GROUP_NAME_ATTRIBUTE
              value: {{ default "cn" $ldap.groupNameAttribute | quote }}
            - name: LDAP_USER_GROUP_ATTRIBUTE
              value: {{ default "memberOf" $ldap.userGroupAttribute | quote }}
            - name: LDAP_ROLE_GROUP_MAPPINGS
              value: {{ default dict $ldap.roleGroupMappings | toJson | quote }}
            - name: RBAC_BOOTSTRAP_PLATFORM_ADMINS
              value: {{ default list $identity.bootstrapPlatformAdmins | join "," | quote }}
            - name: RBAC_BOOTSTRAP_ROLE_GRANTS
              value: {{ default dict $identity.bootstrapRoleGrants | toJson | quote }}
            - name: ENTERPRISE_LICENSE_ENFORCEMENT_ENABLED
              value: {{ default false $license.enforcementEnabled | quote }}
            - name: ENTERPRISE_CLIENT_ID
              value: {{ default (default "client" $values.client.id) $license.clientId | quote }}
            - name: ENTERPRISE_CLIENT_NAME
              value: {{ default "" $values.client.name | quote }}
            - name: ENTERPRISE_INSTALLATION_ID
              value: {{ default (printf "%s-%s" .Release.Name .Release.Namespace) $license.installationId | quote }}
            - name: ENTERPRISE_LICENSE_MODE
              value: {{ default "online-sync" $license.mode | quote }}
            - name: ENTERPRISE_LICENSE_SYNC_ENDPOINT
              value: {{ default "" $license.syncEndpoint | quote }}
            - name: ENTERPRISE_LICENSE_CACHE_FILE
              value: /app/data/enterprise-license-cache.json
            - name: ENTERPRISE_LICENSE_ACTIVATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default "horizon-license-activation" $license.activationTokenSecretName | quote }}
                  key: {{ default "activationToken" $license.activationTokenSecretKey | quote }}
                  optional: true
            - name: ENTERPRISE_LICENSE_PUBLIC_KEY_FILE
              value: /etc/horizon/license/publicKeyPem
            - name: ENTERPRISE_LICENSE_PUBLIC_KEY_ID
              value: {{ default (default "" $runner.publicKeyId) $license.publicKeyId | quote }}
          volumeMounts:
            - name: backend-data
              mountPath: /app/data
            - name: environment-catalog
              mountPath: /app/config/environment-catalog.json
              subPath: environment-catalog.json
              readOnly: true
            - name: license-public-key
              mountPath: /etc/horizon/license
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: horizon-backend-data
        - name: environment-catalog
          configMap:
            name: horizon-enterprise-config
            items:
              - key: ENVIRONMENT_CATALOG_JSON
                path: environment-catalog.json
        - name: license-public-key
          secret:
            secretName: {{ default "horizon-license-public-key" $runner.publicKeySecretName | quote }}
            optional: true
            items:
              - key: {{ default "publicKeyPem" $runner.publicKeySecretKey | quote }}
                path: publicKeyPem
---
apiVersion: v1
kind: Service
metadata:
  name: horizon-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: horizon-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
{{- end }}
{{- if default true $jenkins.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-jenkins
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-jenkins
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ default 1 $jenkins.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: horizon-jenkins
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: horizon-jenkins
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/jenkins-credentials: {{ include (print $.Template.BasePath "/jenkins-credentials-secret.yaml") . | sha256sum }}
        checksum/jenkins-security: {{ include (print $.Template.BasePath "/jenkins-security-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ default "jenkins" (default $jenkinsAccess.serviceAccountName $jenkinsSa.name) }}
      securityContext:
        fsGroup: 1000
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- range $imagePullSecrets }}
        - name: {{ if kindIs "map" . }}{{ .name | quote }}{{ else }}{{ . | quote }}{{ end }}
        {{- end }}
      {{- end }}
      containers:
        - name: jenkins
          image: {{ required "components.jenkins.image is required" $jenkins.image | quote }}
          imagePullPolicy: {{ default "Always" $jenkins.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_OPTS
              value: {{ default "-Djenkins.install.runSetupWizard=false" $jenkins.javaOpts | quote }}
            - name: JENKINS_OPTS
              value: {{ if and $jenkinsPath (ne $jenkinsPath "/") }}{{ printf "--prefix=%s" $jenkinsPath | quote }}{{ else }}""{{ end }}
            - name: JENKINS_RUNTIME_ROLE_ARN
              valueFrom:
                configMapKeyRef:
                  name: horizon-enterprise-config
                  key: JENKINS_RUNTIME_ROLE_ARN
                  optional: true
            - name: JENKINS_EXECUTION_MODE
              value: {{ default "runner" $jenkins.executionMode | quote }}
            - name: HORIZON_RUNNER_URL
              value: {{ default "http://horizon-runner:8080" $jenkinsRunner.url | quote }}
            - name: HORIZON_RUNNER_CLI
              value: {{ default "/usr/local/bin/horizon-runner" $jenkinsRunner.cliPath | quote }}
            - name: HORIZON_JENKINS_SECURITY_ENABLED
              value: {{ default true $jenkins.securityEnabled | quote }}
            - name: HORIZON_JENKINS_SECURITY_REALM
              value: {{ default "private" $jenkins.securityRealm | quote }}
            - name: JENKINS_LDAP_SERVER
              value: {{ default "ldap://horizon-openldap:389" $ldap.host | quote }}
            - name: JENKINS_LDAP_ROOT_DN
              value: {{ default "dc=horizonrelevance,dc=local" $ldap.baseDn | quote }}
            - name: JENKINS_LDAP_USER_SEARCH_BASE
              value: {{ default "ou=users,dc=horizonrelevance,dc=local" $ldap.userBaseDn | quote }}
            - name: JENKINS_LDAP_USER_SEARCH
              value: {{ default "uid={0}" $jenkinsLdap.userSearch | quote }}
            - name: JENKINS_LDAP_GROUP_SEARCH_BASE
              value: {{ default "ou=groups,dc=horizonrelevance,dc=local" $ldap.groupBaseDn | quote }}
            - name: JENKINS_LDAP_GROUP_SEARCH_FILTER
              value: {{ default "(&(objectClass=groupOfNames)(member={user_dn}))" $ldap.groupSearchFilter | quote }}
            - name: JENKINS_LDAP_MANAGER_DN
              value: {{ default "cn=admin,dc=horizonrelevance,dc=local" $ldap.bindDn | quote }}
            - name: JENKINS_LDAP_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "horizon-ldap-bind" $ldap.bindSecretName | quote }}
                  key: {{ default "password" $ldap.bindSecretKey | quote }}
                  optional: true
            - name: JENKINS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $jenkinsCredentialsSecretName | quote }}
                  key: JENKINS_ADMIN_USER
            - name: JENKINS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $jenkinsCredentialsSecretName | quote }}
                  key: JENKINS_ADMIN_PASSWORD
            - name: JENKINS_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $jenkinsCredentialsSecretName | quote }}
                  key: JENKINS_SERVICE_USER
            - name: JENKINS_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $jenkinsCredentialsSecretName | quote }}
                  key: JENKINS_SERVICE_PASSWORD
            - name: JENKINS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $jenkinsCredentialsSecretName | quote }}
                  key: JENKINS_SERVICE_TOKEN
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: jenkins-security
              mountPath: /var/jenkins_home/init.groovy.d/01-horizon-security.groovy
              subPath: 01-horizon-security.groovy
          readinessProbe:
            httpGet:
              path: {{ if and $jenkinsPath (ne $jenkinsPath "/") }}{{ printf "%s/login" $jenkinsPath | quote }}{{ else }}"/login"{{ end }}
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: {{ if and $jenkinsPath (ne $jenkinsPath "/") }}{{ printf "%s/login" $jenkinsPath | quote }}{{ else }}"/login"{{ end }}
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: horizon-jenkins-home
        - name: jenkins-security
          configMap:
            name: horizon-jenkins-security
---
apiVersion: v1
kind: Service
metadata:
  name: horizon-jenkins
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-jenkins
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: horizon-jenkins
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
{{- end }}
{{- if default true $runner.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-runner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-runner
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ default 1 $runner.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: horizon-runner
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: horizon-runner
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ default "jenkins" (default $jenkinsAccess.serviceAccountName $jenkinsSa.name) }}
      securityContext:
        fsGroup: 10001
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- range $imagePullSecrets }}
        - name: {{ if kindIs "map" . }}{{ .name | quote }}{{ else }}{{ . | quote }}{{ end }}
        {{- end }}
      {{- end }}
      containers:
        - name: runner
          image: {{ required "components.runner.image is required" $runner.image | quote }}
          imagePullPolicy: {{ default "Always" $runner.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ default 8080 $runner.servicePort }}
          env:
            - name: HORIZON_CLIENT_ID
              value: {{ default (default "client" $values.client.id) $license.clientId | quote }}
            - name: HORIZON_INSTALLATION_ID
              value: {{ default (printf "%s-%s" .Release.Name .Release.Namespace) $license.installationId | quote }}
            - name: HORIZON_ACTIVATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default "horizon-license-activation" $license.activationTokenSecretName | quote }}
                  key: {{ default "activationToken" $license.activationTokenSecretKey | quote }}
                  optional: true
            - name: HORIZON_RUNNER_MODE
              value: {{ default "signed-plan" $runner.mode | quote }}
            - name: HORIZON_RUNNER_EXECUTE
              value: {{ default true $runner.executeActions | quote }}
            - name: HORIZON_KANIKO_IMAGE
              value: {{ default "gcr.io/kaniko-project/executor:v1.23.2" $runner.kanikoImage | quote }}
            - name: HORIZON_RUNNER_KEEP_BUILD_JOBS
              value: {{ default false $runner.keepBuildJobs | quote }}
            - name: HORIZON_EXECUTION_PLAN_ENDPOINT
              value: {{ default "" $runner.executionPlanEndpoint | quote }}
            - name: HORIZON_EXECUTION_EVENT_ENDPOINT
              value: {{ default "" $runner.eventEndpoint | quote }}
            - name: HORIZON_FINDINGS_UPLOAD_URL
              value: {{ default "http://horizon-backend:8000/upload_vulnerabilities" $runner.findingsUploadUrl | quote }}
            {{- if $runner.findingsUploadTokenSecretName }}
            - name: HORIZON_FINDINGS_UPLOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $runner.findingsUploadTokenSecretName | quote }}
                  key: {{ default "token" $runner.findingsUploadTokenSecretKey | quote }}
                  optional: {{ default true $runner.findingsUploadTokenSecretOptional }}
            {{- end }}
            - name: HORIZON_SECURITY_FAIL_ON_SEVERITY
              value: {{ default "CRITICAL,HIGH" $runner.securityFailOnSeverity | quote }}
            - name: HORIZON_SECURITY_FAIL_ON_DASHBOARD_UPLOAD
              value: {{ default false $runner.securityFailOnDashboardUpload | quote }}
            - name: HORIZON_RUNNER_CACHE_ENABLED
              value: {{ default true $runner.cacheEnabled | quote }}
            - name: HORIZON_RUNNER_GRACE_PERIOD_HOURS
              value: {{ default 24 $runner.gracePeriodHours | quote }}
            - name: HORIZON_RUNNER_WORK_DIR
              value: {{ default "/var/lib/horizon-runner" $runner.workDir | quote }}
            - name: HORIZON_RUNNER_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: HORIZON_RUNNER_SERVICE_ACCOUNT
              value: {{ default "jenkins" (default $jenkinsAccess.serviceAccountName $jenkinsSa.name) | quote }}
            - name: HORIZON_UI_TEST_ISOLATED
              value: {{ default false $runner.uiTestIsolated | quote }}
            - name: HORIZON_UI_TEST_IMAGE
              value: {{ default "mcr.microsoft.com/playwright:v1.44.1-jammy" $runner.uiTestImage | quote }}
            - name: SONAR_HOST_URL
              value: {{ default "http://horizon-sonarqube:9000" $runnerSonar.hostUrl | quote }}
            {{- if $runnerSonar.tokenSecretName }}
            - name: SONAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $runnerSonar.tokenSecretName | quote }}
                  key: {{ default "token" $runnerSonar.tokenSecretKey | quote }}
                  optional: {{ default false $runnerSonar.tokenSecretOptional }}
            {{- end }}
            - name: HORIZON_PUBLIC_KEY_PATH
              value: /etc/horizon/license/publicKeyPem
          volumeMounts:
            - name: runner-work
              mountPath: {{ default "/var/lib/horizon-runner" $runner.workDir | quote }}
            - name: license-public-key
              mountPath: /etc/horizon/license
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: runner-work
          emptyDir: {}
        - name: license-public-key
          secret:
            secretName: {{ default "horizon-license-public-key" $runner.publicKeySecretName | quote }}
            optional: true
            items:
              - key: {{ default "publicKeyPem" $runner.publicKeySecretKey | quote }}
                path: publicKeyPem
---
apiVersion: v1
kind: Service
metadata:
  name: horizon-runner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-runner
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: horizon-runner
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ default 8080 $runner.servicePort }}
      targetPort: http
---
{{- end }}
{{- if default true $sonarqube.enabled }}
{{- if $sonarqubeGeneratedConfigEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: horizon-sonarqube-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-sonarqube
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  sonar.properties: |
    sonar.web.context={{ default "" $sonarqube.webContext }}
    {{- if eq $sonarqubeAuthProvider "ldap" }}
    sonar.security.realm=LDAP
    ldap.url={{ required "components.sonarqube.auth.ldap.url is required when SonarQube LDAP auth is enabled" $sonarqubeLdap.url }}
    {{- if $sonarqubeLdap.bindDn }}
    ldap.bindDn={{ $sonarqubeLdap.bindDn }}
    {{- end }}
    {{- if $sonarqubeLdap.bindPassword }}
    ldap.bindPassword={{ $sonarqubeLdap.bindPassword }}
    {{- end }}
    ldap.authentication={{ default "simple" $sonarqubeLdap.authentication }}
    ldap.user.baseDn={{ required "components.sonarqube.auth.ldap.userBaseDn is required when SonarQube LDAP auth is enabled" $sonarqubeLdap.userBaseDn }}
    ldap.user.request={{ default "(&(objectClass=inetOrgPerson)(uid={login}))" $sonarqubeLdap.userRequest }}
    ldap.user.realNameAttribute={{ default "cn" $sonarqubeLdap.realNameAttribute }}
    ldap.user.emailAttribute={{ default "mail" $sonarqubeLdap.emailAttribute }}
    {{- if $sonarqubeLdap.groupBaseDn }}
    ldap.group.baseDn={{ $sonarqubeLdap.groupBaseDn }}
    ldap.group.request={{ default "(&(objectClass=groupOfNames)(member={dn}))" $sonarqubeLdap.groupRequest }}
    ldap.group.idAttribute={{ default "cn" $sonarqubeLdap.groupIdAttribute }}
    {{- end }}
    ldap.followReferrals={{ default false $sonarqubeLdap.followReferrals }}
    {{- else if eq $sonarqubeAuthProvider "saml" }}
    {{- range $key, $value := $sonarqubeSamlProperties }}
    {{ $key }}={{ $value }}
    {{- end }}
    {{- end }}
    {{- range $key, $value := $sonarqubeExtraProperties }}
    {{ $key }}={{ $value }}
    {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-sonarqube
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-sonarqube
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ default 1 $sonarqube.replicas }}
  strategy:
    type: {{ default "Recreate" $sonarqube.strategyType | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/name: horizon-sonarqube
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: horizon-sonarqube
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 1000
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- range $imagePullSecrets }}
        - name: {{ if kindIs "map" . }}{{ .name | quote }}{{ else }}{{ . | quote }}{{ end }}
        {{- end }}
      {{- end }}
      containers:
        - name: sonarqube
          image: {{ required "components.sonarqube.image is required" $sonarqube.image | quote }}
          imagePullPolicy: {{ default "Always" $sonarqube.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
              value: "true"
            - name: SONAR_WEB_CONTEXT
              value: {{ default "" $sonarqube.webContext | quote }}
            {{- range $env := default list $sonarqube.extraEnv }}
            - name: {{ required "components.sonarqube.extraEnv[].name is required" $env.name | quote }}
              {{- if hasKey $env "value" }}
              value: {{ $env.value | quote }}
              {{- else if $env.valueFrom }}
              valueFrom:
{{ toYaml $env.valueFrom | indent 16 }}
              {{- end }}
            {{- end }}
          volumeMounts:
            {{- if $sonarqubeConfigEnabled }}
            - name: sonarqube-config
              mountPath: /opt/sonarqube/conf/sonar.properties
              subPath: sonar.properties
              readOnly: true
            {{- end }}
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
            - name: sonarqube-temp
              mountPath: /opt/sonarqube/temp
            - name: sonarqube-logs
              mountPath: /opt/sonarqube/logs
            - name: sonarqube-extensions
              mountPath: /opt/sonarqube/extensions
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/system/status
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 8
      volumes:
        {{- if $sonarqubeConfigEnabled }}
        - name: sonarqube-config
          {{- if $sonarqubeConfigSecretName }}
          secret:
            secretName: {{ $sonarqubeConfigSecretName | quote }}
            items:
              - key: {{ $sonarqubeConfigSecretKey | quote }}
                path: sonar.properties
          {{- else }}
          configMap:
            name: horizon-sonarqube-config
            items:
              - key: sonar.properties
                path: sonar.properties
          {{- end }}
        {{- end }}
        - name: sonarqube-data
          persistentVolumeClaim:
            claimName: horizon-sonarqube-data
        - name: sonarqube-temp
          emptyDir: {}
        - name: sonarqube-logs
          emptyDir: {}
        - name: sonarqube-extensions
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: horizon-sonarqube
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-sonarqube
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: horizon-sonarqube
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9000
      targetPort: http
{{- end }}
