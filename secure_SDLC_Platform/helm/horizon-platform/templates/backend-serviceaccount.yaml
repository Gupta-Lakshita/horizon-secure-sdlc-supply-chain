{{- $accessModel := default dict .Values.accessModel -}}
{{- $backend := default dict $accessModel.backend -}}
{{- $sa := default dict $backend.serviceAccount -}}
{{- $validationRole := default dict $backend.validationRole -}}
{{- if eq (default "provision" $sa.state) "provision" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default "horizon-backend" $sa.name }}
  namespace: {{ default .Release.Namespace $sa.namespace }}
  labels:
    app.kubernetes.io/name: horizon-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- if $validationRole.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $validationRole.roleArn | quote }}
  {{- end }}
{{- end }}
