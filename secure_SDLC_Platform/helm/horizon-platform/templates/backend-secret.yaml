{{- $secretName := default "horizon-backend-secrets" .Values.platform.backendSecretName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingWebhookSecret := "" -}}
{{- $existingJenkinsUser := "" -}}
{{- $existingJenkinsToken := "" -}}
{{- if and $existing (hasKey $existing.data "GITHUB_WEBHOOK_SECRET") -}}
{{- $existingWebhookSecret = (index $existing.data "GITHUB_WEBHOOK_SECRET" | b64dec) -}}
{{- end -}}
{{- if and $existing (hasKey $existing.data "JENKINS_USER") -}}
{{- $existingJenkinsUser = (index $existing.data "JENKINS_USER" | b64dec) -}}
{{- end -}}
{{- if and $existing (hasKey $existing.data "JENKINS_TOKEN") -}}
{{- $existingJenkinsToken = (index $existing.data "JENKINS_TOKEN" | b64dec) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: horizon-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  GITHUB_WEBHOOK_SECRET: {{ default (randAlphaNum 48) $existingWebhookSecret | quote }}
  JENKINS_USER: {{ default (default "admin" .Values.components.jenkins.adminUser) $existingJenkinsUser | quote }}
  JENKINS_TOKEN: {{ default (default "" .Values.components.jenkins.apiToken) $existingJenkinsToken | quote }}
