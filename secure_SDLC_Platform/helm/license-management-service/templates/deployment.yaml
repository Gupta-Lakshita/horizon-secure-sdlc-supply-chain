apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "horizon-license-management-service.fullname" . }}
  labels:
    {{- include "horizon-license-management-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "horizon-license-management-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "horizon-license-management-service.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "horizon-license-management-service.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: license-management-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: HORIZON_LICENSE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "horizon-license-management-service.secretName" . }}
                  key: database-url
            - name: HORIZON_LICENSE_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "horizon-license-management-service.secretName" . }}
                  key: admin-api-key
            - name: HORIZON_LICENSE_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "horizon-license-management-service.secretName" . }}
                  key: signing-secret
            - name: HORIZON_LICENSE_TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "horizon-license-management-service.secretName" . }}
                  key: token-pepper
            - name: HORIZON_LICENSE_ISSUER
              value: {{ .Values.config.issuer | quote }}
            - name: HORIZON_LICENSE_AUTO_CREATE_TABLES
              value: {{ .Values.config.autoCreateTables | quote }}
            - name: HORIZON_LICENSE_SIGNING_MODE
              value: {{ .Values.config.signingMode | quote }}
            - name: HORIZON_LICENSE_KMS_KEY_ID
              value: {{ .Values.config.kmsKeyId | quote }}
            - name: HORIZON_LICENSE_KMS_REGION
              value: {{ .Values.config.kmsRegion | quote }}
            - name: HORIZON_LICENSE_KMS_SIGNING_ALGORITHM
              value: {{ .Values.config.kmsSigningAlgorithm | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
