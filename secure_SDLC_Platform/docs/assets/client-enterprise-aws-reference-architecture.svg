  <!-- Legend and flow notes -->
  <rect class="external" x="565" y="110" width="990" height="250" rx="8"/>
  <text class="label" x="590" y="140">Numbered Flow</text>
  <text class="tiny" x="590" y="168">1. Users access Horizon UI through client DNS, TLS, and ALB ingress.</text>
  <text class="tiny" x="590" y="188">2. Frontend calls backend API; backend resolves Environment Catalog and validates license.</text>
  <text class="tiny" x="590" y="208">3. Backend triggers Jenkins only after preflight passes.</text>
  <text class="tiny" x="590" y="228">4. Jenkins clones client source from the client-approved Git provider inside client AWS.</text>
  <text class="tiny" x="590" y="248">5. Jenkins uses IRSA and STS to assume the selected environment deploy role.</text>
  <text class="tiny" x="590" y="268">6. Deploy roles are namespace-scoped through EKS access entries/RBAC.</text>
  <text class="tiny" x="590" y="288">7. Images are pulled from Horizon ECR and mirrored to client ECR; app images are pushed to client ECR.</text>
  <text class="tiny" x="590" y="308">8. Build, test, scan, image metadata, and release evidence are written to client S3.</text>
  <text class="tiny" x="590" y="328">9. Production pipeline promotes approved images/artifacts to prod account after approval.</text>
  <text class="tiny" x="590" y="348">10. Logs, metrics, audit events, and encrypted secrets stay in the client AWS account.</text>

  <rect class="service network" x="1150" y="128" width="18" height="18" rx="3"/><text class="tiny" x="1177" y="142">Networking / ingress</text>
  <rect class="service compute" x="1150" y="158" width="18" height="18" rx="3"/><text class="tiny" x="1177" y="172">Compute / EKS runtime</text>
  <rect class="service storage" x="1150" y="188" width="18" height="18" rx="3"/><text class="tiny" x="1177" y="202">Storage / artifact repositories</text>
  <rect class="service security" x="1150" y="218" width="18" height="18" rx="3"/><text class="tiny" x="1177" y="232">Security / identity / secrets</text>
  <rect class="service analytics" x="1150" y="248" width="18" height="18" rx="3"/><text class="tiny" x="1177" y="262">Observability / reporting</text>
  <rect class="service devops" x="1150" y="278" width="18" height="18" rx="3"/><text class="tiny" x="1177" y="292">DevOps source and execution</text>

  <text class="tiny" x="36" y="1045">Reference architecture: client source code, artifacts, secrets, logs, container images, and evidence remain inside the client boundary. Horizon Relevance receives only license sync metadata.</text>
</svg>
