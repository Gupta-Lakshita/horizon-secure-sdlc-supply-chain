      .namespace { fill:#f8fafc; stroke:#64748b; stroke-width:1.5; stroke-dasharray:5 4; }
      .external { fill:#f8fafc; stroke:#64748b; stroke-width:1.5; }
      .service { fill:#fff; stroke:#cbd5e1; stroke-width:1.2; rx:8; }
      .network { fill:#e0f2fe; stroke:#0284c7; }
