<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Horizon Relevance Client Enterprise AWS Reference Architecture</title>
  <desc id="desc">AWS-style client-hosted reference architecture showing Horizon Relevance platform components, AWS services, accounts, environments, security boundaries, pipeline flows, and evidence stores.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1d4ed8"/>
    </marker>
    <style>
      .page { fill:#ffffff; }
      .title { font:700 26px Arial, Helvetica, sans-serif; fill:#111827; }
      .subtitle { font:400 15px Arial, Helvetica, sans-serif; fill:#4b5563; }
