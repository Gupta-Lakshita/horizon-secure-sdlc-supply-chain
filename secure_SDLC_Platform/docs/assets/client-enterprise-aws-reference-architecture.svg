  <text class="boxText" x="140" y="220" text-anchor="middle">Developers / QA</text>
  <text class="boxSub" x="140" y="240" text-anchor="middle">Release managers</text>
  <text class="boxSub" x="140" y="256" text-anchor="middle">Platform admins</text>

  <rect class="service security" x="58" y="305" width="164" height="78" rx="8"/>
  <text class="boxText" x="140" y="330" text-anchor="middle">Client Identity</text>
  <text class="boxSub" x="140" y="350" text-anchor="middle">LDAP / AD / OIDC</text>
  <text class="boxSub" x="140" y="366" text-anchor="middle">Group role mapping</text>

