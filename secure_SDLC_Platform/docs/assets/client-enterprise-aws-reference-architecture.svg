  <text class="boxText" x="1025" y="930" text-anchor="middle">Amazon EKS</text>
  <text class="boxSub" x="1025" y="949" text-anchor="middle">prod namespace</text>

  <rect class="service storage" x="1125" y="905" width="160" height="66" rx="8"/>
