  <rect class="page" x="0" y="0" width="1600" height="1080"/>
  <text class="title" x="36" y="44">Horizon Relevance AI DevSecOps - Client Enterprise AWS Reference Architecture</text>
  <text class="subtitle" x="36" y="70">Client-hosted platform model with AWS services, identity, license enforcement, build/test/release pipelines, namespace-scoped EKS access, and audit evidence.</text>

